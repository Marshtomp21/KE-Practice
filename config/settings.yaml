# 全局运行参数。所有路径、阈值、模型参数集中于此，代码中不写死。
paths:
  raw_dir: data/raw
  dataset_dir: data/source/wikipedia_300_films_final
  interim_dir: data/interim
  processed_dir: data/processed
  chunk_file: data/interim/chunks.jsonl
  embedding_file: data/processed/chunk_vectors.npz
  gazetteer: data/interim/wiki_gazetteer.txt   # 语料自带的实体名清单，留空则不启用
  schema_file: config/schema.yaml
  variant_table: config/zh_variants.txt   # 繁简单字对照表，留空则不折叠
  prompt_dir: config/prompts

ingest:
  fold_variants: true             # 把繁体折成简体，统一实体名与规则用词
  target_chunk_chars: 400        # 目标片段长度，非硬切
  max_chunk_chars: 700           # 超过则按句读二次切分
  min_chunk_chars: 60            # 过短片段并入前一片段
  drop_patterns:                 # 清洗时整体删除的噪声模式（正则）
    - '\[\d+\]'
    - '\[编辑\]'
    - '\[来源请求\]'
    - '\{\{[^}]*\}\}'

llm:
  enabled: true
  endpoint: "https://api.siliconflow.cn/v1/chat/completions"
  model: "THUDM/GLM-Z1-9B-0414"
  api_key_env: "GRAPHRAG_LLM_KEY"
  temperature: 0.0
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 3
  retry_backoff_seconds: 2.0
  trust_env_proxy: false          # 默认直连，避免失效的 HTTP_PROXY 干扰模型调用

embedding:
  # provider: remote | hashing
  # hashing 为零依赖的本地字符 n-gram 哈希向量，保证无网络时全流程可跑通
  provider: remote
  endpoint: "https://api.siliconflow.cn/v1/embeddings"
  model: "BAAI/bge-m3"
  api_key_env: "GRAPHRAG_LLM_KEY"
  dimension: 1024
  batch_size: 32
  trust_env_proxy: false


qa:
  # 当前研究主线：本地向量基线，或调用 neo4j-graphrag 的完整库实现
  default_method: vector

retrieval:
  top_k_chunks: 6
  max_context_chars: 6000
  anchor_min_score: 0.55

# KG²RAG-style：向量种子片段 -> 有界知识图扩展 -> 图/语义联合重排。
# 参数独立于其它方法，修改这些值不会改变 vector 或 library_graphrag。
kg2rag:
  seed_chunks: 5
  anchor_top_n: 5
  max_hops: 2
  max_nodes: 80
  candidate_chunks: 30
  semantic_weight: 0.65
  graph_weight: 0.35
  hop_decay: 0.70

# HippoRAG 2-style：查询实体作为重启分布，在本地图上执行带高度节点惩罚的 PPR。
hipporag2:
  anchor_top_n: 5
  alpha: 0.85
  max_iter: 200
  tolerance: 1.0e-8
  top_nodes: 50
  degree_penalty: 0.50
  max_path_hops: 4
  graph_weight: 0.85
  semantic_weight: 0.15

gap_repair:
  search_top_k: 20
  max_queries: 32
  max_rounds: 2
  audit_chunks: 40
  compensation: adaptive       # adaptive | always | off（消融）
  temporary_edges: true        # false：仅检索，不恢复关系
  prune: true                  # 贪心选择预算内的完整证据路径，不声称全局最优
  answer_mode: deterministic   # deterministic | llm（共享生成器对照）
  frontier_queries: true       # 缺一侧支持的候选实体优先检索 + 命中文档局部扩展
  corpus_records: true         # 使用语料角色片单补偿影视关系

# 官方 neo4j-graphrag 库基线。Neo4j 内应已有 Chunk 节点、FROM_CHUNK 关系，
# 且向量索引维度必须与上方 embedding.dimension 一致。
library_graphrag:
  index_name: text_embeddings
  max_retries: 0                 # 失败题由评测 runner 续跑，避免 SDK 单题重复长超时
  # 每个命中片段最多带回多少条图关系，防止热门实体的邻域过大。
  max_relations_per_chunk: 20
  neo4j:
    uri_env: NEO4J_URI
    user_env: NEO4J_USER
    password_env: NEO4J_PASSWORD
    database: ""                 # Aura 使用服务端默认数据库

generation:
  temperature: 0.0
  max_tokens: 1200
  cite_required: true
  refuse_when_empty: true

api:
  host: "127.0.0.1"
  port: 8000
  cors_origins: ["*"]

runtime:
  random_seed: 20260903
  log_level: INFO
